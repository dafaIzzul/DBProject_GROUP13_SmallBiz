<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Manager Dashboard - SmallBiz</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">SmallBiz Manager</div>
        <div class="nav-links">
            <a href="dashboard.html" class="active">Dashboard</a>
            <a href="inventory.html">Inventory</a>
            <a href="purchase.html">Purchase</a>
            <button onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="container">
        <h1>Dashboard Manager</h1>
        <div class="stats-grid">
            <div class="stat-card" style="border-left: 5px solid red;">
                <h3>Low Stock Items</h3>
                <p class="stat-value" id="lowStockCount">0</p>
                <small>Perlu segera restock</small>
            </div>
            </div>
    </div>

    <script src="../../assets/js/auth.js"></script>
    <script>
        checkRole(['Manager', 'Admin']); 

        async function loadLowStock() {
            const token = localStorage.getItem('token');
            // Menggunakan endpoint low-stock yang ada di productRoutes
            const res = await fetch('http://localhost:3000/api/products/low-stock', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            document.getElementById('lowStockCount').innerText = data.count || 0;
        }
        loadLowStock();
    </script>
</body>
</html>
