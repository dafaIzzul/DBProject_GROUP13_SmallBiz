<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Kasir - SmallBiz</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <style>
        /* Layout Grid: Kiri (Produk), Kanan (Keranjang) */
        .pos-container {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 20px;
            padding: 20px;
            height: calc(100vh - 70px);
        }

        /* Bagian Produk (Kiri) */
        .product-section {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }

        .search-box {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            margin-bottom: 15px;
            border: 2px solid #ddd;
            border-radius: 6px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .product-card {
            border: 1px solid #eee;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
            background: #f9f9f9;
        }

        .product-card:hover {
            border-color: #3498db;
            background: #eaf6ff;
            transform: translateY(-2px);
        }

        .product-price { font-weight: bold; color: #27ae60; }
        .product-stock { font-size: 0.8em; color: #7f8c8d; }

        /* Bagian Keranjang (Kanan) */
        .cart-section {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }

        .cart-table-wrapper {
            flex-grow: 1;
            overflow-y: auto;
        }

        .cart-table {
            width: 100%;
            border-collapse: collapse;
        }

        .cart-table th { text-align: left; padding: 10px; border-bottom: 2px solid #eee; font-size: 0.9rem;}
        .cart-table td { padding: 10px; border-bottom: 1px solid #eee; }

        /* INPUT KUANTITAS YANG FLEKSIBEL */
        .qty-input {
            width: 60px;
            padding: 5px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }

        .total-section {
            margin-top: auto;
            border-top: 2px solid #eee;
            padding-top: 15px;
        }

        .grand-total {
            font-size: 24px;
            font-weight: bold;
            text-align: right;
            margin-bottom: 15px;
            color: #2c3e50;
        }

        .btn-checkout {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-checkout:hover { background-color: #219150; }
        .btn-delete { background: #e74c3c; color: white; border: none; padding: 5px 8px; border-radius: 4px; cursor: pointer;}
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">SmallBiz POS</div>
        <div class="nav-links">
            <span id="cashierName" style="margin-right: 15px; font-weight: bold;"></span>
            <button onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="pos-container">
        <div class="product-section">
            <input type="text" id="searchProduct" class="search-box" placeholder="Cari nama produk atau scan barcode..." onkeyup="filterProducts()">
            <div id="productList" class="product-grid">
                </div>
        </div>

        <div class="cart-section">
            <h2>Keranjang</h2>
            <div class="cart-table-wrapper">
                <table class="cart-table">
                    <thead>
                        <tr>
                            <th>Produk</th>
                            <th>Harga</th>
                            <th>Qty</th> <th>Subtotal</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="cartBody">
                        </tbody>
                </table>
            </div>

            <div class="total-section">
                <div class="grand-total" id="grandTotal">Rp 0</div>
                <div style="margin-bottom: 10px;">
                    <label>Bayar (Rp):</label>
                    <input type="number" id="payAmount" style="width:100%; padding:10px; font-size:16px;">
                </div>
                <button class="btn-checkout" onclick="processCheckout()">Bayar & Cetak</button>
            </div>
        </div>
    </div>

    <script src="../../assets/js/auth.js"></script>
    <script>
        // Cek Login & Role
        checkRole(['Admin', 'Manager', 'Cashier']); 
        const user = JSON.parse(localStorage.getItem('user'));
        document.getElementById('cashierName').textContent = `Kasir: ${user.username}`;
        const token = localStorage.getItem('token');

        let allProducts = [];
        let cart = [];

        // --- 1. LOAD PRODUK ---
        async function loadProducts() {
            try {
                const res = await fetch('http://localhost:3000/api/products', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const result = await res.json();
                if(result.success) {
                    allProducts = result.data;
                    renderProducts(allProducts);
                }
            } catch (err) {
                console.error(err);
                alert("Gagal memuat produk");
            }
        }

        function renderProducts(products) {
            const container = document.getElementById('productList');
            container.innerHTML = '';
            
            products.forEach(p => {
                if (p.Stock_Quantity > 0) { // Hanya tampilkan yang ada stok
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.onclick = () => addToCart(p);
                    card.innerHTML = `
                        <strong>${p.Product_Name}</strong><br>
                        <span class="product-price">Rp ${parseInt(p.Price).toLocaleString()}</span><br>
                        <span class="product-stock">Stok: ${p.Stock_Quantity}</span>
                    `;
                    container.appendChild(card);
                }
            });
        }

        function filterProducts() {
            const query = document.getElementById('searchProduct').value.toLowerCase();
            const filtered = allProducts.filter(p => 
                p.Product_Name.toLowerCase().includes(query) || 
                p.Product_ID.toString().includes(query)
            );
            renderProducts(filtered);
        }

        // --- 2. LOGIKA KERANJANG (CART) ---
        
        function addToCart(product) {
            // Cek apakah produk sudah ada di keranjang
            const existingItem = cart.find(item => item.id === product.Product_ID);
            
            if (existingItem) {
                // Jika sudah ada, tambah 1 (tapi cek stok dulu)
                if (existingItem.qty < product.Stock_Quantity) {
                    existingItem.qty++;
                } else {
                    alert('Stok tidak mencukupi!');
                }
            } else {
                // Jika belum ada, masukkan ke keranjang
                cart.push({
                    id: product.Product_ID,
                    name: product.Product_Name,
                    price: product.Price,
                    qty: 1,
                    maxStock: product.Stock_Quantity
                });
            }
            renderCart();
        }

        // FUNGSI INTI: Update Qty Manual dari Input
        function updateCartQty(id, newQty) {
            const item = cart.find(i => i.id === id);
            if (!item) return;

            const qty = parseInt(newQty);

            // Validasi Input
            if (isNaN(qty) || qty < 1) {
                item.qty = 1; // Minimal 1
                alert("Jumlah minimal 1");
            } else if (qty > item.maxStock) {
                item.qty = item.maxStock; // Tidak boleh lebih dari stok
                alert(`Stok hanya tersedia ${item.maxStock}`);
            } else {
                item.qty = qty;
            }

            renderCart(); // Refresh tampilan (untuk update subtotal & balikin angka jika overlimit)
        }

        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            renderCart();
        }

        function renderCart() {
            const tbody = document.getElementById('cartBody');
            tbody.innerHTML = '';
            let total = 0;

            cart.forEach(item => {
                const subtotal = item.price * item.qty;
                total += subtotal;

                tbody.innerHTML += `
                    <tr>
                        <td>${item.name}</td>
                        <td>${parseInt(item.price).toLocaleString()}</td>
                        <td>
                            <input type="number" 
                                   class="qty-input" 
                                   value="${item.qty}" 
                                   min="1" 
                                   max="${item.maxStock}"
                                   onchange="updateCartQty(${item.id}, this.value)">
                        </td>
                        <td>${subtotal.toLocaleString()}</td>
                        <td>
                            <button class="btn-delete" onclick="removeFromCart(${item.id})">X</button>
                        </td>
                    </tr>
                `;
            });

            document.getElementById('grandTotal').textContent = 'Rp ' + total.toLocaleString('id-ID');
        }

        // --- 3. CHECKOUT (TRANSAKSI) ---
        async function processCheckout() {
            if (cart.length === 0) return alert('Keranjang kosong!');

            const totalAmount = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const payAmount = parseFloat(document.getElementById('payAmount').value);

            if (!payAmount || payAmount < totalAmount) {
                return alert('Uang pembayaran kurang!');
            }

            // Siapkan data sesuai format Backend
            const payload = {
                items: cart.map(item => ({
                    productId: item.id,
                    quantity: item.qty
                })),
                totalAmount: totalAmount,
                paymentMethod: 'Cash', // Bisa dikembangkan jadi dropdown
                paidAmount: payAmount,
                notes: 'Penjualan Kasir'
            };

            try {
                const res = await fetch('http://localhost:3000/api/transactions/create', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(payload)
                });

                const result = await res.json();

                if (result.success) {
                    const kembalian = payAmount - totalAmount;
                    alert(`Transaksi Berhasil!\nKembalian: Rp ${kembalian.toLocaleString()}`);
                    
                    // Reset
                    cart = [];
                    renderCart();
                    document.getElementById('payAmount').value = '';
                    loadProducts(); // Reload stok terbaru
                } else {
                    alert('Gagal: ' + result.message);
                }
            } catch (err) {
                console.error(err);
                alert('Terjadi kesalahan koneksi');
            }
        }

        // Init
        loadProducts();
    </script>
</body>
</html>
